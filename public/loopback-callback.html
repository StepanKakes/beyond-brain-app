<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyond Brain</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f5f2; color: #1d1c1a; }
    @media (prefers-color-scheme: dark) { body { background: #151412; color: #ece9e3; } }
    main { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { margin: 0 0 14px; opacity: .75; }
    textarea { width: 100%; height: 110px; box-sizing: border-box; font: 12px/1.4 ui-monospace, monospace; padding: 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 id="h">Přihlášení předáno, okno se zavře.</h1>
    <p id="p" hidden>Vlož ji do pole pod konektorem v Beyond Brainu a klikni Dokončit.</p>
    <textarea id="t" readonly hidden></textarea>
  </main>
  <script>
    (function () {
      var href = location.href;
      var sent = false;
      if (window.opener) {
        try { window.opener.postMessage({ type: 'beyond-mcp-oauth-loopback', url: href }, '*'); sent = true; } catch (e) {}
      }
      if (sent) {
        setTimeout(function () { try { window.close(); } catch (e) {} }, 600);
      } else {
        document.getElementById('h').textContent = 'Zkopíruj tuhle adresu';
        var p = document.getElementById('p'); p.hidden = false;
        var t = document.getElementById('t'); t.hidden = false; t.value = href;
        t.addEventListener('focus', function () { t.select(); });
        t.focus();
      }
    })();
  </script>
</body>
</html>
