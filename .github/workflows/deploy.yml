name: Deploy

# Vercel-style continuous deploy for the self-hosted Beyond Brain box.
#
# Trigger: any push to `main` (or a manual "Run workflow"). A self-hosted
# GitHub Actions runner installed on Vlast's Windows box picks the job up,
# checks out EXACTLY the pushed commit into the live app directory, rebuilds
# client + server, and restarts the Windows service.
#
# Guarantees:
#   * Typecheck, lint or build fails -> the service is NOT restarted, the old
#     version keeps serving (the run just shows red in the Actions tab).
#   * The run only goes green once the restarted service answers /health, so a
#     deploy that boots into a crash loop is reported as failed instead of
#     silently leaving the box down.
#   * The restart waits (up to ten minutes) for running chat replies and
#     scheduled jobs to finish, so a deploy never cuts work in half.
#   * `.env`, `dist/`, `dist-server/`, `node_modules/` are gitignored, so
#     `git reset --hard` never touches secrets or local build output.
#   * concurrency: two pushes in a row queue instead of racing each other.
#
# One-time setup of the runner: scripts/setup-actions-runner.ps1 (run elevated).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: beyond-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The runner is registered with these labels by setup-actions-runner.ps1.
    runs-on: [self-hosted, windows, beyond-brain]
    timeout-minutes: 25
    steps:
      - name: Pull, build and restart
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Live app dir + service name are overridable via machine env vars set
          # by the runner setup script; sensible defaults for this box otherwise.
          $app    = if ($env:BEYOND_APP_DIR)      { $env:BEYOND_APP_DIR }      else { 'C:\Users\Vlast\beyond\beyond-brain-app' }
          $svc    = if ($env:BEYOND_SERVICE_NAME) { $env:BEYOND_SERVICE_NAME } else { 'BeyondBrainApp' }
          $health = if ($env:BEYOND_HEALTH_URL)   { $env:BEYOND_HEALTH_URL }   else { 'http://127.0.0.1:3001/health' }
          Write-Host "==> Deploying $env:GITHUB_SHA  ->  $app  (service: $svc)"

          if (-not (Test-Path $app)) { throw "App directory not found: $app" }
          Set-Location $app

          # Snapshot the current commit so we can tell whether deps changed.
          $before = (git rev-parse HEAD).Trim()

          # Vercel semantics: the box becomes exactly the pushed commit.
          # (Discards any uncommitted local edits on the box by design.)
          git fetch origin --prune
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git reset --hard "origin/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          $after = (git rev-parse HEAD).Trim()
          Write-Host "==> $before -> $after"

          # Only reinstall deps when the lockfile changed (or node_modules is
          # missing) — a clean `npm ci` every push would rebuild native modules
          # (node-pty) each time and is slow.
          $depsChanged = git diff --name-only $before $after -- package.json package-lock.json
          if ($depsChanged -or -not (Test-Path 'node_modules')) {
            # The running service holds the native modules open (bcrypt,
            # node-pty, better-sqlite3), and `npm ci` empties node_modules
            # first, so Windows refuses with EPERM. Stop it for the install and
            # let the restart at the end bring it back.
            Write-Host "==> deps changed / missing -> stop service, npm ci"
            Stop-Service $svc -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            npm ci
            if ($LASTEXITCODE -ne 0) {
              Start-Service $svc -ErrorAction SilentlyContinue
              throw "npm ci failed"
            }
          } else {
            Write-Host "==> deps unchanged -> skipping npm ci"
          }

          # Gates before the build. Both are cheap next to a full build and
          # catch the class of breakage that otherwise only shows up as a blank
          # page at runtime. A failure here leaves the running service alone.
          Write-Host "==> typecheck"
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed" }

          # eslint exits non-zero only on errors; warnings do not block a deploy.
          Write-Host "==> lint"
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "lint failed" }

          Write-Host "==> build:client"
          npm run build:client
          if ($LASTEXITCODE -ne 0) { throw "build:client failed" }

          Write-Host "==> build:server"
          npm run build:server
          if ($LASTEXITCODE -ne 0) { throw "build:server failed" }

          # Only reached when the build fully succeeded. Before the restart,
          # wait for a quiet moment: a restart in the middle of a chat reply or
          # a scheduled job cuts that work off and the person sees it fail.
          # /health reports what is in flight; wait up to ten minutes, then
          # restart anyway so a stuck turn cannot block deploys for ever.
          Write-Host "==> Waiting for the box to be idle"
          foreach ($attempt in 1..60) {
            $busy = $null
            try {
              $res = Invoke-WebRequest -Uri $health -UseBasicParsing -TimeoutSec 5
              $busy = ($res.Content | ConvertFrom-Json).busy
            } catch {
              # The old version may not answer; nothing to wait for then.
            }
            if (-not $busy) { break }
            if ($busy.chats -eq 0 -and -not $busy.job) { break }
            Write-Host "    in flight: $($busy.chats) chat(s), job: $($busy.job) (attempt $attempt)"
            Start-Sleep -Seconds 10
          }

          # Keep the service's own output. nssm writes stdout and stderr to a
          # file when told to; without this the box has no log of what the
          # app said, and the Diagnose workflow has nothing to read.
          $nssm = (Get-CimInstance Win32_Service -Filter "Name='$svc'" -ErrorAction SilentlyContinue).PathName
          if ($nssm -and (Test-Path $nssm) -and $nssm -match 'nssm') {
            New-Item -ItemType Directory -Force -Path "$app\logs" | Out-Null
            & $nssm set $svc AppStdout "$app\logs\service.log" | Out-Null
            & $nssm set $svc AppStderr "$app\logs\service.log" | Out-Null
            & $nssm set $svc AppRotateFiles 1 | Out-Null
            & $nssm set $svc AppRotateOnline 1 | Out-Null
            & $nssm set $svc AppRotateBytes 10485760 | Out-Null
            Write-Host "==> service log: $app\logs\service.log"
          }

          # It may already be stopped (a dependency install above).
          if ((Get-Service $svc).Status -eq 'Stopped') {
            Write-Host "==> Start-Service $svc"
            Start-Service $svc
          } else {
            Write-Host "==> Restart-Service $svc"
            Restart-Service $svc -Force
          }

          # Confirm it came back up.
          Start-Sleep -Seconds 2
          $status = (Get-Service $svc).Status
          Write-Host "==> $svc is now: $status"
          if ($status -ne 'Running') { throw "$svc did not return to Running (state: $status)" }

          # "Running" only means the service host started the process — it says
          # nothing about whether the app bound its port or died on boot. Poll
          # the public /health endpoint until it answers, so a deploy that
          # crash-loops fails the run instead of quietly leaving the box down.
          Write-Host "==> Waiting for $health"
          $ok = $false
          foreach ($attempt in 1..30) {
            try {
              $res = Invoke-WebRequest -Uri $health -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) {
                Write-Host "==> healthy after $attempt attempt(s): $($res.Content)"
                $ok = $true
                break
              }
            } catch {
              # Connection refused while the app is still booting is expected.
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw "$svc is Running but $health never answered (waited ~60 s)" }

          Write-Host "==> Deployed $after OK"
