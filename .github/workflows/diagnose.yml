name: Diagnose

# Read-only look at the box, run by hand from the Actions tab. Nobody has to
# sit at the Windows machine to see why a chat did not answer: prints the
# service, the tail of its log, the last chat messages the app recorded and
# the newest Claude transcripts. Changes nothing.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back to look
        default: '3'

jobs:
  diagnose:
    runs-on: [self-hosted, windows, beyond-brain]
    timeout-minutes: 10
    steps:
      - name: Look
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $app = if ($env:BEYOND_APP_DIR) { $env:BEYOND_APP_DIR } else { 'C:\Users\Vlast\beyond\beyond-brain-app' }
          $svc = if ($env:BEYOND_SERVICE_NAME) { $env:BEYOND_SERVICE_NAME } else { 'BeyondBrainApp' }
          $hours = [double]'${{ github.event.inputs.hours }}'
          $since = (Get-Date).AddHours(-$hours)
          Set-Location $app

          Write-Host "=== service"
          Get-CimInstance Win32_Service -Filter "Name='$svc'" | Format-List Name, State, StartName, PathName, ProcessId
          Write-Host "=== health"
          try { (Invoke-WebRequest -Uri http://127.0.0.1:3001/health -UseBasicParsing -TimeoutSec 5).Content } catch { Write-Host "no answer: $_" }
          Write-Host "=== commit"
          git log -1 --format='%h %cd %s'

          Write-Host "=== log files"
          $logs = @()
          if (Get-Command nssm -ErrorAction SilentlyContinue) {
            foreach ($k in 'AppStdout', 'AppStderr') {
              $p = (nssm get $svc $k 2>$null)
              if ($p) { Write-Host "$k = $p"; $logs += $p }
            }
          }
          $logs += Get-ChildItem -Path $app, "$app\logs", "$env:USERPROFILE\.cloudcli", "$env:ProgramData\$svc" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $logs = $logs | Select-Object -Unique
          foreach ($l in $logs) {
            if (Test-Path $l) {
              Write-Host "--- $l ($( (Get-Item $l).LastWriteTime ))"
              Get-Content $l -Tail 200 -ErrorAction SilentlyContinue | Select-String -Pattern 'beyond|stream|error|Error|restart|shutdown|listening|session' | Select-Object -Last 120
            }
          }

          Write-Host "=== claude on the box"
          try {
            $cfg = Get-Content "$env:USERPROFILE\.claude.json" -Raw | ConvertFrom-Json
            Write-Host "account: $($cfg.oauthAccount.emailAddress)  org: $($cfg.oauthAccount.organizationName)  sub: $($cfg.oauthAccount.subscriptionType)"
          } catch { Write-Host "no .claude.json: $_" }
          try { Write-Host "version: $(claude --version 2>&1)" } catch { Write-Host "claude not on PATH: $_" }
          foreach ($m in 'sonnet', 'opus') {
            Write-Host "--- probe $m"
            $job = Start-Job -ScriptBlock { param($mm, $dir) Set-Location $dir; claude -p 'Odpověz jedním slovem: ok' --model $mm --output-format json 2>&1 | Out-String } -ArgumentList $m, $app
            if (Wait-Job $job -Timeout 120) {
              $out = Receive-Job $job
              try {
                $j = $out | ConvertFrom-Json
                Write-Host "is_error=$($j.is_error) subtype=$($j.subtype) result=$(($j.result | Out-String).Trim().Substring(0, [Math]::Min(160, ($j.result | Out-String).Trim().Length)))"
              } catch { Write-Host ($out | Out-String).Substring(0, [Math]::Min(400, ($out | Out-String).Length)) }
            } else { Write-Host "no answer in 120 s"; Stop-Job $job }
            Remove-Job $job -Force
          }

          Write-Host "=== app history (last 40 chat messages)"
          node scripts\diagnose.cjs

          Write-Host "=== claude transcripts touched in the last $hours h"
          $files = Get-ChildItem -Path "$env:USERPROFILE\.claude\projects" -Recurse -Filter *.jsonl -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $since } | Sort-Object LastWriteTime
          foreach ($f in $files) {
            Write-Host "--- $($f.Name) $($f.LastWriteTime) $([math]::Round($f.Length / 1024)) kB"
            Get-Content $f.FullName -Tail 12 | ForEach-Object {
              try {
                $j = $_ | ConvertFrom-Json
                $role = if ($j.message.role) { $j.message.role } else { $j.type }
                $txt = ''
                if ($j.message.content -is [string]) { $txt = $j.message.content }
                elseif ($j.message.content) { $txt = ($j.message.content | ForEach-Object { if ($_.type -eq 'text') { $_.text } elseif ($_.type -eq 'tool_use') { "[tool $($_.name)]" } elseif ($_.type -eq 'tool_result') { '[tool_result]' } }) -join ' ' }
                if ($txt.Length -gt 110) { $txt = $txt.Substring(0, 110) }
                Write-Host ("  {0} {1,-9} {2}" -f $j.timestamp, $role, ($txt -replace "`n", ' '))
              } catch { Write-Host "  ?" }
            }
          }
